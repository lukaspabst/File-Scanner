[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:app]
command=gunicorn -b :8080 --workers=2 --timeout 300 scanner:app
autorestart=true
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT=8080