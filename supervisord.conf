[supervisord]
nodaemon=true
user=root  # Explicitly declare you're running as root (or better, create a non-root user)

[program:clamd]
command=/usr/sbin/clamd --foreground=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:app]
command=gunicorn -b 0.0.0.0:8080 scanner:app --workers=2 --timeout 300
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0